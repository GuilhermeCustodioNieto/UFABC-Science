# Configuração Alembic para uso manual (ex.: `alembic revision --autogenerate -m "..."`).
# A URL do banco NÃO é definida aqui: env.py lê DATABASE_URL via Settings (.env).
# O comando `python -m ufabc_science init-db` não depende deste arquivo.

[alembic]
script_location = src/ufabc_science/infrastructure/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
