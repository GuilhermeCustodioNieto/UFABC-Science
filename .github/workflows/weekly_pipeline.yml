# Coleta, geração e (com AUTO_PUBLISH, padrão "true") publicação automática semanal.
# Publicação automática: só rascunhos de IA real com verificação PASSED e sem avisos são
# aprovados (editorial/autopublish.py); o site avisa que não houve revisão humana.
# Para voltar ao fluxo com revisão humana, defina a variável AUTO_PUBLISH = false.
# IA padrão: Google Gemini (API compatível com OpenAI, cota gratuita), chave no secret AI_API_KEY.
# Agendamento: segundas-feiras às 11:00 UTC = 08:00 em America/Sao_Paulo (UTC-3).
# O Brasil não adota horário de verão desde 2019; se voltar a adotar, a execução
# ocorrerá às 09:00 locais nesse período (ver docs/AUTOMATION_GUIDE.md).
name: Pipeline semanal

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Período de coleta em dias (vazio = COLLECTION_DAYS)"
        required: false
        default: ""
      sources:
        description: "Fontes separadas por vírgula (vazio = todas habilitadas)"
        required: false
        default: ""
      max_articles:
        description: "Máximo de artigos por fonte (vazio = MAX_ARTICLES_PER_SOURCE)"
        required: false
        default: ""
      generation_limit:
        description: "Máximo de rascunhos gerados (vazio = GENERATION_LIMIT)"
        required: false
        default: ""
      steps:
        description: "Etapas a executar"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - collect,enrich
          - classify,score
          - process

# Escrita é necessária apenas para atualizar a branch de dados ("data"). Pages só no job
# "deploy".
permissions:
  contents: write

concurrency:
  group: ufabc-science-data
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Curadoria (até CURATION_LIMIT chamadas) + redação e revisão (até 4 chamadas por
    # matéria) com um modelo que "pensa" podem passar de 45 minutos.
    timeout-minutes: 90
    outputs:
      site: ${{ steps.site.outcome }}
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATA_DIR: persist/data
      EDITIONS_DIR: persist/editions
      DATABASE_URL: sqlite:///persist/data/database/ufabc_science.db
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      ENABLED_SOURCES: ${{ vars.ENABLED_SOURCES || 'openalex,pubmed,arxiv,crossref' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai_compatible' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gemini-3.6-flash' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      # Modelos do Gemini que "pensam" gastam tokens de saída com o raciocínio.
      AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS || '8000' }}
      # Respostas com raciocínio podem passar de 1 min; o Gemini às vezes responde 503.
      AI_TIMEOUT: ${{ vars.AI_TIMEOUT || '240' }}
      AI_MAX_RETRIES: ${{ vars.AI_MAX_RETRIES || '3' }}
      # Cota gratuita do Gemini limita chamadas por minuto: espaça as chamadas e, no HTTP 429,
      # espera Retry-After (ou 20/40/80 s) antes de tentar de novo.
      AI_MIN_INTERVAL: ${{ vars.AI_MIN_INTERVAL || '8' }}
      # O job tem 90 min. Depois de 70 min o pipeline não começa novas chamadas à IA, para
      # sobrar tempo de salvar os dados (um job cancelado por tempo não salva nada).
      PIPELINE_AI_BUDGET_MINUTES: ${{ vars.PIPELINE_AI_BUDGET_MINUTES || '70' }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
      OUTPUT_DIR: dist
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      INPUT_DAYS: ${{ inputs.days }}
      INPUT_SOURCES: ${{ inputs.sources }}
      INPUT_MAX_ARTICLES: ${{ inputs.max_articles }}
      INPUT_GENERATION_LIMIT: ${{ inputs.generation_limit }}
      INPUT_STEPS: ${{ inputs.steps || 'auto' }}
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Dependências
        run: python -m pip install .

      - name: Recuperar dados persistentes
        run: bash scripts/data_branch.sh fetch persist

      - name: Validar configuração
        run: python -m ufabc_science config check

      - name: Banco de dados
        run: python -m ufabc_science init-db

      - name: Executar pipeline (coleta, classificação, relevância e rascunhos)
        id: run
        shell: bash
        run: |
          set -euo pipefail
          steps="$INPUT_STEPS"
          if [ "$steps" = "auto" ]; then
            # Rascunhos só são gerados quando há um provedor de IA real configurado.
            if [ "$AI_PROVIDER" = "mock" ]; then steps="collect,enrich,classify,score"; else steps="all"; fi
          fi
          args=(--trigger "${GITHUB_EVENT_NAME}" --steps "$steps")
          [ -n "$INPUT_DAYS" ] && args+=(--days "$INPUT_DAYS")
          [ -n "$INPUT_SOURCES" ] && args+=(--sources "$INPUT_SOURCES")
          [ -n "$INPUT_MAX_ARTICLES" ] && args+=(--max-articles "$INPUT_MAX_ARTICLES")
          [ -n "$INPUT_GENERATION_LIMIT" ] && args+=(--limit "$INPUT_GENERATION_LIMIT")
          python -m ufabc_science run "${args[@]}"

      - name: Publicação automática (somente rascunhos PASSED, sem avisos)
        id: autopublish
        if: ${{ !cancelled() && env.AUTO_PUBLISH == 'true' }}
        run: python -m ufabc_science autopublish

      - name: Persistir dados na branch "data"
        id: persist
        if: ${{ !cancelled() }}
        env:
          RUN_LABEL: "${{ github.run_id }} (${{ github.event_name }})"
        run: |
          bash scripts/data_branch.sh commit persist "data: execução $RUN_LABEL"

      - name: Artefatos da execução (14 dias)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execucao-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            persist/data/runs/
            persist/data/editorial/pending/
            persist/data/raw/

      # O site só é implantado se os dados foram persistidos (nada publicado fica sem registro).
      - name: Gerar site público (somente edições publicadas)
        id: site
        if: ${{ !cancelled() && env.AUTO_PUBLISH == 'true' && steps.persist.outcome == 'success' }}
        run: python -m ufabc_science site build --strict

      - name: Enviar site
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: pipeline
    if: ${{ !cancelled() && needs.pipeline.outputs.site == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Implantar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
