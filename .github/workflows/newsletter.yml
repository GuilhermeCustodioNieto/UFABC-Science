# Envio manual da newsletter por e-mail (Brevo). Executado SOMENTE por ação manual.
# - teste: envia a edição publicada mais recente (ou a informada) só para o secret
#   NEWSLETTER_TEST_EMAIL. Não usa a lista de assinantes e não registra envio.
# - assinantes: envia para a lista BREVO_LIST_ID (uma única vez por edição); exige a
#   confirmação "ENVIAR edicao-NNN". Útil se o envio automático de segunda falhar.
name: Enviar newsletter

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Destino do envio"
        required: true
        default: teste
        type: choice
        options:
          - teste
          - assinantes
      edition:
        description: "Número da edição (vazio = mais recente publicada)"
        required: false
        default: ""
      confirm:
        description: 'Só para "assinantes": digite exatamente "ENVIAR edicao-NNN"'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ufabc-science-data
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: persist/data
      EDITIONS_DIR: persist/editions
      DATABASE_URL: sqlite:///persist/data/database/ufabc_science.db
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NEWSLETTER_SENDER_EMAIL: ${{ vars.NEWSLETTER_SENDER_EMAIL }}
      BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      NEWSLETTER_TEST_EMAIL: ${{ secrets.NEWSLETTER_TEST_EMAIL }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_EDITION: ${{ inputs.edition }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Dependências
        run: python -m pip install .

      - name: Recuperar dados persistentes
        run: bash scripts/data_branch.sh fetch persist

      - name: Enviar
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$INPUT_EDITION" ]; then
            if ! [[ "$INPUT_EDITION" =~ ^[0-9]{1,4}$ ]]; then
              echo "::error::Número de edição inválido."; exit 1
            fi
            args+=(--edition "$INPUT_EDITION")
          fi
          if [ "$INPUT_MODE" = "teste" ]; then
            python -m ufabc_science newsletter send --test "${args[@]}"
            exit 0
          fi
          if [ -z "$INPUT_EDITION" ]; then
            echo "::error::Para enviar aos assinantes, informe o número da edição."; exit 1
          fi
          expected="ENVIAR edicao-$(printf '%03d' "$((10#$INPUT_EDITION))")"
          if [ "$INPUT_CONFIRM" != "$expected" ]; then
            echo "::error::Confirmação incorreta. Digite exatamente: $expected"; exit 1
          fi
          python -m ufabc_science newsletter send "${args[@]}"

      - name: Registrar envio na branch "data"
        if: ${{ !cancelled() && inputs.mode == 'assinantes' }}
        env:
          RUN_LABEL: "${{ github.run_id }}"
        run: |
          bash scripts/data_branch.sh commit persist "newsletter: envio manual $RUN_LABEL"
